<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisión de Decretos Huérfanos - PGN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --accent: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #dc2626 0%, #f59e0b 100%);
            border-radius: 15px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .header p {
            opacity: 0.9;
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1rem;
        }

        .nav-back:hover {
            background: var(--bg-hover);
            color: white;
        }

        .search-section {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-dark);
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: black;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--bg-card);
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--warning);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
        }

        .results-table th,
        .results-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .results-table th {
            background: var(--bg-dark);
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .results-table tr:hover td {
            background: var(--bg-hover);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .badge-orphan {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .pdf-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.6rem;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .pdf-link:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn-review {
            padding: 0.4rem 0.8rem;
            background: var(--primary-light);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-review:hover {
            background: var(--primary);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            width: 100%;
            max-width: 1200px;
            margin: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
        }

        .ocr-text {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }

        .correction-form {
            background: var(--bg-dark);
            border-radius: 10px;
            padding: 1rem;
        }

        .correction-form h4 {
            margin-bottom: 1rem;
            color: var(--success);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .funcionario-entry {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .funcionario-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .btn-remove {
            background: var(--danger);
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="nav-back">← Volver a Consultas</a>

        <header class="header">
            <h1>⚠️ Revisión de Decretos Huérfanos</h1>
            <p>Decretos sin novedades extraídas o con errores de procesamiento</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="statTotal">-</div>
                <div class="stat-label">Total Huérfanos</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statPendientes">-</div>
                <div class="stat-label">Pendientes Revisión</div>
            </div>
        </div>

        <section class="search-section">
            <form class="search-form" id="searchForm">
                <div class="form-group">
                    <label for="decreto">Decreto #</label>
                    <input type="text" id="decreto" placeholder="Número...">
                </div>
                <div class="form-group">
                    <label for="anio">Año</label>
                    <select id="anio">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="soloPendientes">Tipo</label>
                    <select id="soloPendientes">
                        <option value="false">Todos huérfanos</option>
                        <option value="true">Solo PENDIENTE_REVISION</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
        </section>

        <div id="resultsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando decretos huérfanos...</p>
            </div>
        </div>
    </div>

    <!-- Modal de Corrección -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Corregir Decreto</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <script>
        const API_URL = '';
        let currentDecretoId = null;
        let currentOcrText = '';

        // Catálogo de códigos de novedad
        const CODIGOS = [
            { codigo: 'N', descripcion: 'Nombramiento' },
            { codigo: 'NAADH', descripcion: 'Nombramiento Ad Honorem' },
            { codigo: 'E', descripcion: 'Encargo' },
            { codigo: 'RE', descripcion: 'Retorno de Encargo' },
            { codigo: 'R', descripcion: 'Renuncia' },
            { codigo: 'REU', descripcion: 'Renuncia de Encargo' },
            { codigo: 'RN', descripcion: 'Revocación de Nombramiento' },
            { codigo: 'RADH', descripcion: 'Retiro Ad Honorem' },
            { codigo: 'RFZ', descripcion: 'Retiro Forzoso' },
            { codigo: 'RF', descripcion: 'Retiro Fallecimiento' },
            { codigo: 'INSUB', descripcion: 'Insubsistencia' },
            { codigo: 'C', descripcion: 'Comisión' },
            { codigo: 'AC', descripcion: 'Adición a Comisión' },
            { codigo: 'TP', descripcion: 'Traslado Provisional' },
            { codigo: 'T', descripcion: 'Traslado' },
            { codigo: 'VACADH', descripcion: 'Vacaciones Adhonorem' },
            { codigo: 'REVC', descripcion: 'Revocación de Comisión' },
            { codigo: 'OTRO', descripcion: 'Otro tipo de novedad' }
        ];

        async function loadStats() {
            try {
                // Contar TODOS los huérfanos (sin filtro de año)
                const resp = await fetch(`${API_URL}/api/huerfanos`);
                const data = await resp.json();
                document.getElementById('statTotal').textContent = data.total;

                const resp2 = await fetch(`${API_URL}/api/huerfanos?solo_pendientes=true`);
                const data2 = await resp2.json();
                document.getElementById('statPendientes').textContent = data2.total;

                // Cargar años
                const statsResp = await fetch(`${API_URL}/api/stats`);
                const stats = await statsResp.json();
                const anioSelect = document.getElementById('anio');
                stats.anios.forEach(anio => {
                    if (anio) anioSelect.innerHTML += `<option value="${anio}">${anio}</option>`;
                });
            } catch (error) {
                console.error('Error cargando stats:', error);
            }
        }

        async function search(e) {
            if (e) e.preventDefault();

            const decreto = document.getElementById('decreto').value.trim();
            const anio = document.getElementById('anio').value;
            const soloPendientes = document.getElementById('soloPendientes').value;

            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Buscando...</p></div>';

            try {
                const params = new URLSearchParams();
                if (decreto) params.append('decreto', decreto);
                if (anio) params.append('anio', anio);
                params.append('solo_pendientes', soloPendientes);

                const resp = await fetch(`${API_URL}/api/huerfanos?${params}`);
                const data = await resp.json();

                if (data.total === 0) {
                    container.innerHTML = '<div class="loading"><p>No se encontraron decretos huérfanos</p></div>';
                    return;
                }

                let html = `<p style="margin-bottom:1rem;color:var(--text-secondary)">Encontrados: <strong>${data.total}</strong> decretos</p>`;
                html += '<table class="results-table"><thead><tr>';
                html += '<th>Decreto</th><th>Año</th><th>Estado</th><th>Novedades</th><th>PDF</th><th>Acción</th>';
                html += '</tr></thead><tbody>';

                data.huerfanos.forEach(d => {
                    const estado = d.num_novedades === 0
                        ? '<span class="badge badge-orphan">SIN NOVEDADES</span>'
                        : `<span class="badge badge-error">${d.codigo}</span>`;
                    const pdfLink = d.ruta_completa
                        ? `<a class="pdf-link" href="/pdf/${encodeURIComponent(d.ruta_completa)}" target="_blank">📄 Ver</a>`
                        : '-';

                    html += `<tr>
                        <td><strong>${d.numero_decreto}</strong></td>
                        <td>${d.anio}</td>
                        <td>${estado}</td>
                        <td>${d.num_novedades}</td>
                        <td>${pdfLink}</td>
                        <td><button class="btn-review" onclick="openReview(${d.id})">✏️ Corregir</button></td>
                    </tr>`;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Error en búsqueda:', error);
                container.innerHTML = '<div class="loading"><p>Error al buscar</p></div>';
            }
        }

        async function openReview(decretoId) {
            currentDecretoId = decretoId;
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');

            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando...</p></div>';
            modal.classList.add('active');

            try {
                const resp = await fetch(`${API_URL}/api/decreto/${decretoId}`);
                const data = await resp.json();

                if (data.error) {
                    content.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
                    return;
                }

                const decreto = data.decreto;
                currentOcrText = decreto.contenido_texto || '';
                document.getElementById('modalTitle').textContent = `Corregir Decreto ${decreto.numero_decreto}-${decreto.anio}`;

                const pdfLink = decreto.ruta_completa
                    ? `<a class="pdf-link" href="/pdf/${encodeURIComponent(decreto.ruta_completa)}" target="_blank" style="font-size:1rem;">📄 Ver PDF Completo</a>`
                    : '';

                let html = `
                    <div style="margin-bottom:1rem;">
                        ${pdfLink}
                        <span style="margin-left:1rem;color:var(--text-secondary)">| Archivo: ${decreto.archivo_origen || 'N/A'}</span>
                    </div>

                    <div class="two-columns">
                        <div>
                            <h4 style="margin-bottom:0.5rem;color:var(--accent)">📄 Texto OCR Extraído</h4>
                            <div class="ocr-text" id="ocrTextDisplay">${decreto.contenido_texto || 'No hay texto disponible'}</div>
                        </div>

                        <div class="correction-form">
                            <h4>✏️ Corrección Manual</h4>
                            
                            <div id="alertContainer"></div>
                            <div id="validationResult"></div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Código Novedad *</label>
                                    <select id="codigoNovedad" onchange="updateTipoNovedad()">
                                        <option value="">Seleccionar...</option>
                                        ${CODIGOS.map(c => `<option value="${c.codigo}">${c.codigo} - ${c.descripcion}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Tipo Novedad</label>
                                    <input type="text" id="tipoNovedad" placeholder="Descripción...">
                                </div>
                            </div>

                            <div class="form-group" style="margin-bottom:1rem;">
                                <label>Razonamiento (analizado por GPT-4)</label>
                                <textarea id="razonamiento" rows="2" style="width:100%;padding:0.5rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);resize:vertical;" placeholder="Explica brevemente por qué este código..."></textarea>
                            </div>

                            <div style="margin-bottom:1rem;">
                                <div style="display:flex;justify-content:space-between;align-items:center;">
                                    <h5>Funcionarios</h5>
                                    <button type="button" class="btn btn-success" onclick="addFuncionario()" style="padding:0.4rem 0.8rem;font-size:0.8rem;">+ Agregar</button>
                                </div>
                            </div>

                            <div id="funcionariosContainer"></div>

                            <div style="display:flex;gap:0.5rem;margin-top:1rem;">
                                <button type="button" class="btn btn-warning" onclick="validateWithGPT()" style="flex:1;">
                                    🤖 Validar con GPT
                                </button>
                                <button type="button" class="btn btn-primary" onclick="saveCorrection()" style="flex:1;">
                                    💾 Guardar
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                content.innerHTML = html;
            } catch (error) {
                console.error('Error cargando decreto:', error);
                content.innerHTML = '<div class="alert alert-error">Error al cargar decreto</div>';
            }
        }

        function updateTipoNovedad() {
            const codigo = document.getElementById('codigoNovedad').value;
            const found = CODIGOS.find(c => c.codigo === codigo);
            if (found) {
                document.getElementById('tipoNovedad').value = found.descripcion;
            }
        }

        let funcionarioCount = 0;

        async function addFuncionario(preloadData = null) {
            funcionarioCount++;
            const container = document.getElementById('funcionariosContainer');
            const funcId = funcionarioCount;

            const html = `
                <div class="funcionario-entry" id="func${funcId}">
                    <div class="funcionario-header">
                        <strong>Funcionario ${funcId}</strong>
                        <button type="button" class="btn-remove" onclick="removeFuncionario(${funcId})">×</button>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cédula <button type="button" onclick="searchFuncionario(${funcId})" style="font-size:0.7rem;padding:0.2rem 0.4rem;background:var(--accent);color:white;border:none;border-radius:4px;cursor:pointer;">🔍 Buscar</button></label>
                            <input type="text" class="func-cedula" id="funcCedula${funcId}" placeholder="Sin puntos..." value="${preloadData?.cedula || ''}">
                        </div>
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" class="func-nombre" id="funcNombre${funcId}" placeholder="NOMBRES APELLIDOS" value="${preloadData?.nombre_completo || ''}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cargo</label>
                            <input type="text" class="func-cargo" id="funcCargo${funcId}" placeholder="Ej: Profesional Universitario" value="${preloadData?.cargo || ''}">
                        </div>
                        <div class="form-group">
                            <label>Dependencia</label>
                            <input type="text" class="func-dependencia" id="funcDep${funcId}" placeholder="Ej: Procuraduría Regional..." value="${preloadData?.dependencia || ''}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Acción/Observación</label>
                        <input type="text" class="func-accion" id="funcAccion${funcId}" placeholder="Lo que dice el decreto..." value="${preloadData?.accion || ''}">
                    </div>
                    <div id="funcSearchResult${funcId}" style="font-size:0.8rem;color:var(--text-secondary);margin-top:0.5rem;"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        async function searchFuncionario(funcId) {
            const cedula = document.getElementById(`funcCedula${funcId}`).value.replace(/\./g, '').trim();
            const resultDiv = document.getElementById(`funcSearchResult${funcId}`);

            if (!cedula) {
                resultDiv.innerHTML = '<span style="color:var(--danger)">Ingresa una cédula primero</span>';
                return;
            }

            resultDiv.innerHTML = '<span style="color:var(--accent)">Buscando...</span>';

            try {
                const resp = await fetch(`${API_URL}/api/buscar_funcionario?cedula=${cedula}`);
                const data = await resp.json();

                if (data.encontrados > 0) {
                    const func = data.funcionarios[0];
                    // Prellenar campos
                    document.getElementById(`funcNombre${funcId}`).value = func.nombre_completo || '';
                    document.getElementById(`funcCargo${funcId}`).value = func.cargo || '';
                    document.getElementById(`funcDep${funcId}`).value = func.dependencia || '';

                    resultDiv.innerHTML = `<span style="color:var(--success)">✅ Encontrado: ${func.nombre_completo} (ya existe en BD)</span>`;
                } else {
                    resultDiv.innerHTML = '<span style="color:var(--warning)">⚠️ No encontrado - se creará nuevo funcionario</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<span style="color:var(--danger)">Error: ${error.message}</span>`;
            }
        }

        function removeFuncionario(id) {
            document.getElementById('func' + id).remove();
        }

        async function validateWithGPT() {
            const alertContainer = document.getElementById('alertContainer');
            const validationResult = document.getElementById('validationResult');

            const codigoNovedad = document.getElementById('codigoNovedad').value;
            const tipoNovedad = document.getElementById('tipoNovedad').value;
            const razonamiento = document.getElementById('razonamiento').value;

            if (!codigoNovedad) {
                alertContainer.innerHTML = '<div class="alert alert-error">Selecciona un código de novedad primero</div>';
                return;
            }

            // Recoger funcionarios
            const funcionarios = [];
            document.querySelectorAll('.funcionario-entry').forEach(entry => {
                const cedula = entry.querySelector('.func-cedula').value.trim();
                const nombre = entry.querySelector('.func-nombre').value.trim();
                if (cedula || nombre) {
                    funcionarios.push({ cedula, nombre_completo: nombre });
                }
            });

            validationResult.innerHTML = '<div style="padding:1rem;background:rgba(14,165,233,0.1);border-radius:8px;"><div class="spinner" style="width:24px;height:24px;margin:0 auto;"></div><p style="text-align:center;color:var(--accent);margin-top:0.5rem;">Analizando con GPT-4o-mini...</p></div>';

            try {
                const resp = await fetch(`${API_URL}/api/validar_correccion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        texto_ocr: currentOcrText,
                        codigo_novedad: codigoNovedad,
                        tipo_novedad: tipoNovedad,
                        razonamiento: razonamiento,
                        funcionarios: funcionarios
                    })
                });

                const data = await resp.json();

                if (data.success) {
                    const v = data.validacion;
                    const bgColor = v.codigo_valido ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)';
                    const borderColor = v.codigo_valido ? 'var(--success)' : 'var(--danger)';

                    let html = `<div style="padding:1rem;background:${bgColor};border:1px solid ${borderColor};border-radius:8px;margin-bottom:1rem;">`;
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">`;
                    html += `<strong style="color:${borderColor}">${v.codigo_valido ? '✅ Código válido' : '❌ Revisar código'}</strong>`;
                    html += `<span style="font-size:0.8rem;color:var(--text-secondary)">Confianza: ${(v.confianza * 100).toFixed(0)}%</span>`;
                    html += `</div>`;

                    if (v.codigo_sugerido && !v.codigo_valido) {
                        html += `<p style="color:var(--warning)">💡 Código sugerido: <strong>${v.codigo_sugerido}</strong></p>`;
                    }

                    if (v.observaciones) {
                        html += `<p style="font-size:0.9rem;margin-top:0.5rem;">${v.observaciones}</p>`;
                    }

                    if (v.correcciones_ocr && v.correcciones_ocr.length > 0) {
                        html += `<div style="margin-top:0.5rem;padding:0.5rem;background:rgba(245,158,11,0.1);border-radius:4px;">`;
                        html += `<strong style="font-size:0.8rem;color:var(--warning)">Posibles errores OCR:</strong>`;
                        html += `<ul style="margin:0.25rem 0 0 1rem;font-size:0.85rem;">`;
                        v.correcciones_ocr.forEach(c => html += `<li>${c}</li>`);
                        html += `</ul></div>`;
                    }

                    if (v.razonamiento_mejorado) {
                        html += `<div style="margin-top:0.5rem;padding:0.5rem;background:rgba(59,130,246,0.1);border-radius:4px;">`;
                        html += `<strong style="font-size:0.8rem;color:var(--primary-light)">Razonamiento mejorado:</strong>`;
                        html += `<p style="font-size:0.85rem;margin-top:0.25rem;">${v.razonamiento_mejorado}</p>`;
                        html += `<button onclick="document.getElementById('razonamiento').value='${v.razonamiento_mejorado.replace(/'/g, "\\'")}'" style="font-size:0.75rem;padding:0.2rem 0.5rem;background:var(--primary-light);color:white;border:none;border-radius:4px;cursor:pointer;margin-top:0.5rem;">Usar este razonamiento</button>`;
                        html += `</div>`;
                    }

                    // Mostrar funcionarios extraídos por GPT
                    if (v.funcionarios_extraidos && v.funcionarios_extraidos.length > 0) {
                        window.funcionariosGPT = v.funcionarios_extraidos;
                        html += `<div style="margin-top:0.5rem;padding:0.5rem;background:rgba(16,185,129,0.15);border:1px solid var(--success);border-radius:4px;">`;
                        html += `<strong style="font-size:0.8rem;color:var(--success)">👥 ${v.funcionarios_extraidos.length} Funcionario(s) extraído(s):</strong>`;
                        html += `<ul style="margin:0.25rem 0 0 1rem;font-size:0.85rem;">`;
                        v.funcionarios_extraidos.forEach(f => {
                            html += `<li><strong>${f.nombre_completo}</strong> (CC: ${f.cedula}) - ${f.cargo || ''}</li>`;
                        });
                        html += `</ul>`;
                        html += `<button onclick="loadFuncionariosFromGPT()" style="font-size:0.8rem;padding:0.4rem 0.8rem;background:var(--success);color:white;border:none;border-radius:6px;cursor:pointer;margin-top:0.5rem;width:100%;">📥 Cargar funcionario(s) al formulario</button>`;
                        html += `</div>`;
                    }

                    // Mostrar alertas de validación de cédulas
                    if (data.alertas_cedula && data.alertas_cedula.length > 0) {
                        const alertasWarning = data.alertas_cedula.filter(a => a.nivel === 'warning');
                        const alertasInfo = data.alertas_cedula.filter(a => a.nivel === 'info' && a.tipo !== 'CEDULA_NUEVA');

                        if (alertasWarning.length > 0) {
                            html += `<div style="margin-top:0.5rem;padding:0.8rem;background:rgba(239,68,68,0.15);border:2px solid var(--danger);border-radius:8px;">`;
                            html += `<strong style="font-size:0.9rem;color:var(--danger);">⚠️ ALERTAS DE INTEGRIDAD DE CÉDULAS:</strong>`;
                            html += `<ul style="margin:0.5rem 0 0 1rem;font-size:0.85rem;">`;
                            alertasWarning.forEach(alerta => {
                                html += `<li style="margin-bottom:0.5rem;">`;
                                html += `<div><strong>Cédula ${alerta.cedula}:</strong></div>`;
                                html += `<div style="color:var(--danger);">${alerta.mensaje}</div>`;
                                html += `<div style="color:var(--warning);font-style:italic;font-size:0.8rem;">💡 ${alerta.sugerencia}</div>`;
                                if (alerta.nombre_bd) {
                                    html += `<div style="font-size:0.8rem;color:var(--text-secondary);margin-top:0.3rem;">En BD: <strong>${alerta.nombre_bd}</strong></div>`;
                                }
                                html += `</li>`;
                            });
                            html += `</ul></div>`;
                        }

                        if (alertasInfo.length > 0) {
                            html += `<div style="margin-top:0.5rem;padding:0.5rem;background:rgba(14,165,233,0.1);border:1px solid var(--accent);border-radius:6px;">`;
                            html += `<strong style="font-size:0.8rem;color:var(--accent);">ℹ️ Notas sobre cédulas:</strong>`;
                            html += `<ul style="margin:0.25rem 0 0 1rem;font-size:0.8rem;">`;
                            alertasInfo.forEach(alerta => {
                                html += `<li>${alerta.mensaje}</li>`;
                            });
                            html += `</ul></div>`;
                        }
                    }

                    html += `</div>`;
                    validationResult.innerHTML = html;
                } else {
                    validationResult.innerHTML = `<div class="alert alert-error">Error GPT: ${data.error}</div>`;
                }
            } catch (error) {
                validationResult.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }

        function useRazonamiento() {
            if (window.razonamientoGPT) {
                document.getElementById('razonamiento').value = window.razonamientoGPT;
            }
        }

        function loadFuncionariosFromGPT() {
            if (!window.funcionariosGPT || window.funcionariosGPT.length === 0) return;
            document.getElementById('funcionariosContainer').innerHTML = '';
            funcionarioCount = 0;
            window.funcionariosGPT.forEach(func => {
                addFuncionario({
                    cedula: func.cedula || '',
                    nombre_completo: func.nombre_completo || '',
                    cargo: func.cargo || '',
                    dependencia: func.dependencia || '',
                    accion: func.accion || ''
                });
            });
            document.getElementById('alertContainer').innerHTML = `<div class="alert alert-success">✅ Cargados ${window.funcionariosGPT.length} funcionario(s). Puedes modificar antes de guardar.</div>`;
        }

        async function saveCorrection() {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = '';

            const codigoNovedad = document.getElementById('codigoNovedad').value;
            const tipoNovedad = document.getElementById('tipoNovedad').value;
            const razonamiento = document.getElementById('razonamiento').value;

            if (!codigoNovedad) {
                alertContainer.innerHTML = '<div class="alert alert-error">Selecciona un código de novedad</div>';
                return;
            }

            // Recoger funcionarios
            const funcionarios = [];
            document.querySelectorAll('.funcionario-entry').forEach(entry => {
                const cedula = entry.querySelector('.func-cedula').value.trim().replace(/\./g, '');
                const nombre = entry.querySelector('.func-nombre').value.trim();
                const cargo = entry.querySelector('.func-cargo').value.trim();
                const dependencia = entry.querySelector('.func-dependencia').value.trim();
                const accion = entry.querySelector('.func-accion').value.trim();

                if (cedula || nombre) {
                    funcionarios.push({
                        cedula: cedula,
                        nombre_completo: nombre,
                        nombres: nombre.split(' ').slice(0, 2).join(' '),
                        apellidos: nombre.split(' ').slice(2).join(' '),
                        cargo: cargo,
                        dependencia: dependencia,
                        accion: accion
                    });
                }
            });

            try {
                const resp = await fetch(`${API_URL}/api/corregir`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        decreto_id: currentDecretoId,
                        codigo_novedad: codigoNovedad,
                        tipo_novedad: tipoNovedad,
                        funcionarios: funcionarios,
                        razonamiento: razonamiento
                    })
                });

                const data = await resp.json();

                if (data.success) {
                    alertContainer.innerHTML = `<div class="alert alert-success">✅ ${data.message}</div>`;
                    setTimeout(() => {
                        closeModal();
                        search();  // Refrescar lista
                    }, 1500);
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-error">❌ ${data.error}</div>`;
                }
            } catch (error) {
                alertContainer.innerHTML = `<div class="alert alert-error">❌ Error: ${error.message}</div>`;
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            funcionarioCount = 0;
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.getElementById('searchForm').addEventListener('submit', search);

        // Init
        loadStats();
        search();
    </script>
</body>

</html>
