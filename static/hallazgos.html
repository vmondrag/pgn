<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallazgos para Revisión - PGN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #fff; }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card h3 { font-size: 2rem; color: #f39c12; }
        .stat-card p { color: #aaa; font-size: 0.9rem; }
        .stat-card.warning h3 { color: #e74c3c; }
        
        .filters {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filters select, .filters button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
        }
        .filters button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: none;
            font-weight: bold;
        }
        .filters button:hover { opacity: 0.9; }
        
        .hallazgos-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .hallazgo-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 25px;
            border-left: 4px solid #f39c12;
            transition: transform 0.2s;
        }
        .hallazgo-card:hover { transform: translateX(5px); }
        .hallazgo-card.revisado { border-left-color: #27ae60; opacity: 0.7; }
        .hallazgo-card.descartado { border-left-color: #95a5a6; opacity: 0.5; }
        
        .hallazgo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .hallazgo-titulo {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f39c12;
        }
        
        .hallazgo-tipo {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .hallazgo-detalle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .detalle-seccion h4 {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .detalle-seccion p {
            color: #fff;
            line-height: 1.6;
        }
        
        .detalle-seccion .cedula {
            font-family: monospace;
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 4px;
        }
        
        .hallazgo-descripcion {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.6;
            color: #ddd;
        }
        
        .hallazgo-acciones {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-revisar { background: #27ae60; color: #fff; }
        .btn-descartar { background: #7f8c8d; color: #fff; }
        .btn-corregir { background: #3498db; color: #fff; }
        
        .estado-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 10px;
        }
        .estado-PENDIENTE { background: #f39c12; color: #000; }
        .estado-REVISADO { background: #27ae60; color: #fff; }
        .estado-DESCARTADO { background: #95a5a6; color: #fff; }
        .estado-CORREGIDO { background: #3498db; color: #fff; }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }
        .empty-state h2 { color: #27ae60; margin-bottom: 10px; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            width: 500px;
            max-width: 90%;
        }
        .modal h2 { margin-bottom: 20px; }
        .modal textarea {
            width: 100%;
            min-height: 100px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            margin-bottom: 20px;
            resize: vertical;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-cancelar { background: transparent; border: 1px solid #aaa; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Hallazgos para Revisión</h1>
            <nav class="nav-links">
                <a href="/">Inicio</a>
                <a href="/huerfanos">Huérfanos</a>
                <a href="/errores">Errores</a>
                <a href="/analisis">Análisis</a>
            </nav>
        </header>
        
        <div class="stats-bar">
            <div class="stat-card warning">
                <h3 id="stat-pendientes">-</h3>
                <p>Pendientes de Revisión</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-total">-</h3>
                <p>Total Hallazgos</p>
            </div>
        </div>
        
        <div class="filters">
            <select id="filtro-estado">
                <option value="">Todos los estados</option>
                <option value="PENDIENTE">Pendientes</option>
                <option value="REVISADO">Revisados</option>
                <option value="DESCARTADO">Descartados</option>
                <option value="CORREGIDO">Corregidos</option>
            </select>
            <select id="filtro-tipo">
                <option value="">Todos los tipos</option>
                <option value="CEDULA_OTRO_NOMBRE">Cédula con otro nombre</option>
                <option value="NOMBRE_OTRA_CEDULA">Nombre con otra cédula</option>
            </select>
            <button onclick="cargarHallazgos()">🔄 Actualizar</button>
        </div>
        
        <div id="hallazgos-container" class="hallazgos-list">
            <div class="empty-state">
                <p>Cargando hallazgos...</p>
            </div>
        </div>
    </div>
    
    <!-- Modal para actualizar estado -->
    <div id="modal-estado" class="modal">
        <div class="modal-content">
            <h2>Actualizar Hallazgo</h2>
            <input type="hidden" id="modal-hallazgo-id">
            <input type="hidden" id="modal-nuevo-estado">
            <p style="margin-bottom: 15px; color: #aaa;">Observaciones (opcional):</p>
            <textarea id="modal-observaciones" placeholder="Ingrese observaciones de la revisión..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-revisar" onclick="confirmarActualizacion()">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        async function cargarHallazgos() {
            const estado = document.getElementById('filtro-estado').value;
            const tipo = document.getElementById('filtro-tipo').value;
            
            let url = '/api/hallazgos?limit=100';
            if (estado) url += `&estado=${estado}`;
            if (tipo) url += `&tipo=${tipo}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                document.getElementById('stat-pendientes').textContent = data.pendientes || 0;
                document.getElementById('stat-total').textContent = data.total || 0;
                
                renderHallazgos(data.hallazgos || []);
            } catch (error) {
                console.error('Error cargando hallazgos:', error);
            }
        }
        
        function renderHallazgos(hallazgos) {
            const container = document.getElementById('hallazgos-container');
            
            if (!hallazgos.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>✅ Sin Hallazgos Pendientes</h2>
                        <p>No hay discrepancias para revisar con los filtros seleccionados.</p>
                    </div>`;
                return;
            }
            
            container.innerHTML = hallazgos.map(h => `
                <div class="hallazgo-card ${h.estado.toLowerCase()}">
                    <div class="hallazgo-header">
                        <div>
                            <span class="hallazgo-titulo">Decreto ${h.decreto_numero}-${h.decreto_anio}</span>
                            <span class="estado-badge estado-${h.estado}">${h.estado}</span>
                        </div>
                        <span class="hallazgo-tipo">${h.tipo_hallazgo.replace(/_/g, ' ')}</span>
                    </div>
                    
                    <div class="hallazgo-detalle">
                        <div class="detalle-seccion">
                            <h4>📄 Según el Decreto</h4>
                            <p>
                                <strong>${h.nombre_decreto}</strong><br>
                                Cédula: <span class="cedula">${h.cedula_decreto}</span>
                            </p>
                        </div>
                        <div class="detalle-seccion">
                            <h4>🗄️ En la Base de Datos</h4>
                            <p>
                                <strong>${h.nombre_bd}</strong> (ID: ${h.funcionario_id_bd})<br>
                                Cédula: <span class="cedula">${h.cedula_bd}</span>
                            </p>
                        </div>
                    </div>
                    
                    <div class="hallazgo-descripcion">${h.descripcion}</div>
                    
                    ${h.observaciones ? `<p style="color:#aaa;font-size:0.9rem;margin-bottom:15px;"><strong>Obs:</strong> ${h.observaciones}</p>` : ''}
                    
                    ${h.estado === 'PENDIENTE' ? `
                    <div class="hallazgo-acciones">
                        <button class="btn btn-corregir" onclick="abrirModal(${h.id}, 'CORREGIDO')">✏️ Corregido</button>
                        <button class="btn btn-revisar" onclick="abrirModal(${h.id}, 'REVISADO')">✓ Marcar Revisado</button>
                        <button class="btn btn-descartar" onclick="abrirModal(${h.id}, 'DESCARTADO')">✕ Descartar</button>
                    </div>
                    ` : `
                    <div class="hallazgo-acciones">
                        <button class="btn btn-descartar" onclick="abrirModal(${h.id}, 'PENDIENTE')">↩️ Volver a Pendiente</button>
                    </div>
                    `}
                </div>
            `).join('');
        }
        
        function abrirModal(id, nuevoEstado) {
            document.getElementById('modal-hallazgo-id').value = id;
            document.getElementById('modal-nuevo-estado').value = nuevoEstado;
            document.getElementById('modal-observaciones').value = '';
            document.getElementById('modal-estado').classList.add('active');
        }
        
        function cerrarModal() {
            document.getElementById('modal-estado').classList.remove('active');
        }
        
        async function confirmarActualizacion() {
            const id = document.getElementById('modal-hallazgo-id').value;
            const estado = document.getElementById('modal-nuevo-estado').value;
            const observaciones = document.getElementById('modal-observaciones').value;
            
            try {
                const response = await fetch(`/api/hallazgos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        estado: estado,
                        observaciones: observaciones,
                        usuario_revision: 'Usuario Web'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    cerrarModal();
                    cargarHallazgos();
                } else {
                    alert('Error: ' + (data.error || 'No se pudo actualizar'));
                }
            } catch (error) {
                alert('Error de conexión: ' + error.message);
            }
        }
        
        // Cargar al inicio
        document.addEventListener('DOMContentLoaded', cargarHallazgos);
        
        // Filtros en tiempo real
        document.getElementById('filtro-estado').addEventListener('change', cargarHallazgos);
        document.getElementById('filtro-tipo').addEventListener('change', cargarHallazgos);
    </script>
</body>
</html>
